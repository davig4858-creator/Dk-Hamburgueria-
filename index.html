<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK HAMBURGUERIA — Painel</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,sans-serif;}
body {background:#080418;color:#fff;min-height:100vh;padding:12px;}
.topo {text-align:center;padding:22px;border-radius:16px;border:2px solid #D4AF37;background:linear-gradient(135deg,#250650,#5a109b);box-shadow:0 0 18px #7b2cbf;margin-bottom:16px;}
.topo h1 {color:#D4AF37;font-size:28px;text-shadow:0 0 6px #D4AF37;}
.abas {display:flex;gap:6px;margin-bottom:16px;}
.botaoAba {flex:1;padding:12px;border:none;border-radius:10px 10px 0 0;font-weight:bold;background:#220b44;color:#fff;cursor:pointer;transition:0.2s;}
.botaoAba.ativa {background:#D4AF37;color:#000;box-shadow:0 0 10px #D4AF37;}
.conteudoAba {display:none;background:#14072b;border:1px solid #7b2cbf;border-radius:0 14px 14px 14px;padding:16px;box-shadow:0 0 14px #3c1270;}
.conteudoAba.visivel {display:block;}
h2 {color:#D4AF37;margin-bottom:12px;}
h3 {margin:14px 0 6px;}
input {width:100%;padding:11px;border-radius:8px;border:1px solid #7b2cbf;background:#0b041b;color:#fff;margin:6px 0;}
.botao {width:100%;padding:12px;border:none;border-radius:9px;font-weight:bold;margin:7px 0;cursor:pointer;font-size:15px;}
.botaoDourado {background:#D4AF37;color:#000;box-shadow:0 0 8px #D4AF37;}
.botaoVerde {background:#2cc95b;color:#000;}
.botaoVermelho {background:#e63946;color:#fff;}
.botaoMais {background:#2cc95b;color:#000;font-weight:bold;width:40px;height:40px;border-radius:50%;border:none;font-size:20px;cursor:pointer;}
.botaoMenos {background:#e63946;color:#fff;font-weight:bold;width:40px;height:40px;border-radius:50%;border:none;font-size:20px;cursor:pointer;}
.item {background:#200d3f;border:1px solid #D4AF37;border-radius:10px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.quantidadeItem {background:#110622;border:1px solid #D4AF37;padding:6px 10px;border-radius:6px;font-weight:bold;min-width:30px;text-align:center;}
.totalDia {background:#1f0b3b;border:2px solid #D4AF37;border-radius:10px;padding:14px;margin:12px 0;text-align:center;font-size:20px;font-weight:bold;color:#D4AF37;}
.historicoPedido {background:#0f0520;border:1px solid #D4AF37;border-radius:10px;padding:12px;margin:10px 0;}
.botoesQuantidade {display:flex;align-items:center;gap:6px;}
.aviso {background:#2a1055;border:1px solid #7b2cbf;border-radius:8px;padding:10px;margin:10px 0;font-size:14px;color:#e0c9ff;}
</style>
</head>
<body>
<div class="topo"><h1>DK HAMBURGUERIA</h1></div>

<div class="abas">
<button class="botaoAba ativa" onclick="mudarAba(0)">📋 Lançar Pedidos</button>
<button class="botaoAba" onclick="mudarAba(1)">🍔 Cadastrar Lanches</button>
</div>

<div class="conteudoAba visivel" id="aba0">
<h2>Novo Pedido</h2>
<input type="text" id="nomeCliente" placeholder="Nome do cliente">
<input type="text" id="enderecoCliente" placeholder="Endereço">
<input type="number" id="taxaEntrega" step="0.01" placeholder="Taxa de Entrega R$">

<div class="aviso">🎁 Combo — digite nome e valor:</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
<input type="text" id="nomeCombo" placeholder="Nome do Combo" style="flex:1;min-width:150px;margin:0;">
<input type="number" id="valorCombo" step="0.01" placeholder="R$" style="width:100px;margin:0;">
</div>
<button class="botao botaoVerde" style="margin-top:8px;" onclick="adicionarComboAoPedido()">➕ Adicionar Combo</button>

<h3>🍔 Lanches disponíveis:</h3>
<div id="listaLanchesPedido"></div>

<h3>📝 Itens do pedido:</h3>
<div id="itensDoPedido"></div>

<div class="totalDia">💰 Total vendido no dia: R$ <span id="somaDia">0.00</span></div>

<div style="display:flex;gap:8px;flex-wrap:wrap;">
<button class="botao botaoVerde" style="flex:1;min-width:140px;" onclick="finalizarPedido()">✅ Finalizar Pedido</button>
<button class="botao botaoDourado" style="flex:1;min-width:140px;" onclick="imprimirPedido()">🖨️ Imprimir</button>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
<button class="botao botaoDourado" style="flex:1;min-width:140px;" onclick="salvarEDownloadDia()">💾 Salvar/Vendas</button>
<button class="botao botaoVermelho" style="flex:1;min-width:140px;" onclick="limparHistoricoDia()">🗑️ Limpar Dia</button>
</div>

<h3>📜 Histórico de pedidos do dia:</h3>
<div id="historicoPedidos"></div>
</div>

<div class="conteudoAba" id="aba1">
<h2>Cadastrar Lanches</h2>
<input type="text" id="nomeLancheNovo" placeholder="Nome do lanche">
<input type="number" id="precoLancheNovo" step="0.01" placeholder="Preço R$">
<button class="botao botaoDourado" onclick="cadastrarLanche()">➕ Cadastrar Lanche</button>

<h3>📋 Lanches cadastrados:</h3>
<div id="listaLanchesCadastrados"></div>
</div>

<script>
let abaAtual=0, lanches=[], itensPedidoAtual=[], historicoPedidos=[];

function salvarLocal(c,v){try{localStorage.setItem(c,JSON.stringify(v));return true}catch(e){return false}}
function carregarLocal(c){try{const d=localStorage.getItem(c);return d?JSON.parse(d):[]}catch(e){return []}}
function baixarArquivoTexto(n,t){const b=new Blob([t],{type:'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u)}

document.addEventListener('DOMContentLoaded',function(){
  lanches=carregarLocal('lanches');
  historicoPedidos=carregarLocal('historicoPedidos');
  mudarAba(0);
});

function mudarAba(n){
  abaAtual=n;
  document.querySelectorAll('.conteudoAba').forEach((e,i)=>e.classList.toggle('visivel',i===n));
  document.querySelectorAll('.botaoAba').forEach((e,i)=>e.classList.toggle('ativa',i===n));
  carregarLanchesPedido();
  carregarListaCadastrados();
  carregarHistorico();
  calcularTotalDoDia();
}

function adicionarComboAoPedido(){
  const n=document.getElementById('nomeCombo').value.trim();
  const v=Number(document.getElementById('valorCombo').value);
  if(!n||!v||v<=0){alert('⚠️ Preencha nome e valor do combo!');return}
  itensPedidoAtual.push({nome:'🎁 '+n,preco:v});
  document.getElementById('nomeCombo').value='';
  document.getElementById('valorCombo').value='';
  atualizarItensPedido();
  alert('✅ Combo adicionado!');
}

function carregarLanchesPedido(){
  const d=document.getElementById('listaLanchesPedido');
  d.innerHTML='';
  lanches.forEach(l=>{
    const q=contarItemPedido(l.nome);
    d.innerHTML+=`<div class="item"><span>${l.nome} — R$ ${Number(l.preco).toFixed(2)}</span><div class="botoesQuantidade"><button class="botaoMenos" onclick="removerUmDoPedido('${l.nome}')">−</button><span class="quantidadeItem">${q}</span><button class="botaoMais" onclick="adicionarAoPedido('${l.nome}',${l.preco})">+</button></div></div>`;
  });
}

function contarItemPedido(n){return itensPedidoAtual.filter(i=>i.nome===n).length}
function adicionarAoPedido(n,v){itensPedidoAtual.push({nome:n,preco:v});atualizarItensPedido();carregarLanchesPedido()}
function removerUmDoPedido(n){const i=itensPedidoAtual.findIndex(x=>x.nome===n);if(i!==-1){itensPedidoAtual.splice(i,1);atualizarItensPedido();carregarLanchesPedido()}}

function atualizarItensPedido(){
  const d=document.getElementById('itensDoPedido');
  d.innerHTML='';
  itensPedidoAtual.forEach((x,i)=>{
    d.innerHTML+=`<div class="item"><span>${x.nome} — R$ ${x.preco.toFixed(2)}</span><button class="botao botaoVermelho" style="width:auto;padding:6px 10px;" onclick="removerItem(${i})">✕</button></div>`;
  });
}

function removerItem(i){itensPedidoAtual.splice(i,1);atualizarItensPedido();carregarLanchesPedido()}

function finalizarPedido(){
  const nc=document.getElementById('nomeCliente').value.trim();
  const ec=document.getElementById('enderecoCliente').value.trim();
  const tx=Number(document.getElementById('taxaEntrega').value)||0;
  if(!nc){alert('⚠️ Digite o nome do cliente!');return}
  if(itensPedidoAtual.length===0){alert('⚠️ Adicione pelo menos um item!');return}
  
  let t=0;
  itensPedidoAtual.forEach(i=>t+=i.preco);
  t+=tx;

  const p={
    dataHora:new Date().toLocaleString('pt-BR'),
    nomeCliente:nc,
    endereco:ec,
    taxaEntrega:tx,
    itens:[...itensPedidoAtual],
    total:t
  };
  
  historicoPedidos.push(p);
  salvarLocal('historicoPedidos',historicoPedidos);
  carregarHistorico();
  calcularTotalDoDia();
  
  itensPedidoAtual=[];
  document.getElementById('nomeCliente').value='';
  document.getElementById('enderecoCliente').value='';
  document.getElementById('taxaEntrega').value='';
  atualizarItensPedido();
  carregarLanchesPedido();
  
  alert('✅ Pedido salvo! Total: R$ '+t.toFixed(2));
}

function calcularTotalDoDia(){
  let t=0;
  historicoPedidos.forEach(p=>t+=p.total);
  document.getElementById('somaDia').textContent=t.toFixed(2);
  salvarLocal('vendasDia',t);
}

function carregarHistorico(){
  const d=document.getElementById('historicoPedidos');
  d.innerHTML='';
  if(historicoPedidos.length===0){d.innerHTML='<p style="opacity:0.7;text-align:center;padding:20px;">Nenhum pedido salvo ainda.</p>';return}
  historicoPedidos.forEach((p,i)=>{
    let it='';
    p.itens.forEach(x=>it+='• '+x.nome+' — R$ '+x.preco.toFixed(2)+'<br>');
    d.innerHTML+=`<div class="historicoPedido"><strong>#${i+1} — ${p.dataHora}</strong><br><strong>Cliente:</strong> ${p.nomeCliente}<br>${p.endereco?'<strong>Endereço:</strong> '+p.endereco+'<br>':''}<strong>Itens:</strong><br>${it}${p.taxaEntrega>0?'<strong>Entrega:</strong> R$ '+p.taxaEntrega.toFixed(2)+'<br>':''}<strong style="color:#D4AF37;font-size:16px;">TOTAL: R$ ${p.total.toFixed(2)}</strong><br><button class="botao botaoVermelho" style="margin-top:8px;padding:8px;" onclick="excluirPedido(${i})">🗑️ Excluir este pedido</button></div>`;
  });
}

function excluirPedido(i){if(!confirm('Excluir este pedido?'))return;historicoPedidos.splice(i,1);salvarLocal('historicoPedidos',historicoPedidos);carregarHistorico();calcularTotalDoDia()}

function imprimirPedido(){
  const nc = document.getElementById('nomeCliente').value || 'Cliente';
  const ec = document.getElementById('enderecoCliente').value || '';
  const tx = Number(document.getElementById('taxaEntrega').value) || 0;

  const agrupado = {};
  itensPedidoAtual.forEach(i => {
    if(!agrupado[i.nome]) agrupado[i.nome] = { qtd: 0, preco: i.preco };
    agrupado[i.nome].qtd++;
  });

  let st = 0;
  let linhas = [];
  linhas.push('==========================');
  linhas.push('    DK HAMBURGUERIA');
  linhas.push('==========================');
  linhas.push('DATA: ' + new Date().toLocaleString('pt-BR'));
  linhas.push('CLIENTE: ' + nc);
  if(ec) linhas.push('ENDERECO: ' + ec);
  linhas.push('--------------------------');
  linhas.push('ITENS:');
  
  for(const n in agrupado){
    const x = agrupado[n];
    const v = x.qtd * x.preco;
    st += v;
    linhas.push(x.qtd + 'x ' + n);
    linhas.push('       R$ ' + v.toFixed(2));
  }
  
  linhas.push('--------------------------');
  linhas.push('SUBTOTAL....: R$ ' + st.toFixed(2));
  if(tx > 0) linhas.push('ENTREGA.....: R$ ' + tx.toFixed(2));
  linhas.push('--------------------------');
  linhas.push('TOTAL.......: R$ ' + (st + tx).toFixed(2));
  linhas.push('==========================');
  linhas.push('Obrigado! Volte sempre!');
  linhas.push('');
  linhas.push('');
  linhas.push('');

  const textoFinal = linhas.join('\n');
  window.location.href = 'rawbt://print?text=' + encodeURIComponent(textoFinal);
}

function salvarEDownloadDia(){
  if(historicoPedidos.length===0){alert('⚠️ Nenhum pedido salvo ainda!');return}
  calcularTotalDoDia();
  const d=new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
  let r='==============================\n';
  r+='   DK HAMBURGUERIA\n';
  r+='RELATORIO DE VENDAS — '+new Date().toLocaleDateString('pt-BR')+'\n';
  r+='==============================\n\n';
  let tg=0;
  historicoPedidos.forEach((p,i)=>{
    tg+=p.total;
    r+='PEDIDO '+(i+1)+' — '+p.dataHora+'\n';
    r+='Cliente: '+p.nomeCliente+'\n';
    if(p.endereco)r+='Endereco: '+p.endereco+'\n';
    r+='Itens:\n';
    p.itens.forEach(x=>r+='  - '+x.nome+'  R$ '+x.preco.toFixed(2)+'\n');
    if(p.taxaEntrega>0)r+='  Entrega: R$ '+p.taxaEntrega.toFixed(2)+'\n';
    r+='TOTAL: R$ '+p.total.toFixed(2)+'\n';
    r+='------------------------------\n\n';
  });
  r+='\n==============================\n';
  r+='TOTAL GERAL DO DIA: R$ '+tg.toFixed(2)+'\n';
  r+='Quantidade de pedidos: '+historicoPedidos.length+'\n';
  r+='==============================\n';
  baixarArquivoTexto('vendas_'+d+'.txt',r);
  alert('💾 Relatório baixado com sucesso!');
}

function limparHistoricoDia(){
  if(historicoPedidos.length===0){alert('Ja esta vazio!');return}
  if(!confirm('⚠️ Primeiro faca o download do relatorio!\nTem certeza que deseja apagar TODOS os pedidos?'))return;
  historicoPedidos=[];
  salvarLocal('historicoPedidos',historicoPedidos);
  carregarHistorico();
  calcularTotalDoDia();
  alert('🗑️ Historico limpo! Pronto para o proximo dia!');
}

function cadastrarLanche(){
  const n=document.getElementById('nomeLancheNovo').value.trim();
  const v=Number(document.getElementById('precoLancheNovo').value);
  if(!n||!v||v<=0){alert('⚠️ Digite nome e preco valido!');return}
  lanches.push({nome:n,preco:v});
  salvarLocal('lanches',lanches);
  document.getElementById('nomeLancheNovo').value='';
  document.getElementById('precoLancheNovo').value='';
  carregarLanchesPedido();
  carregarListaCadastrados();
  alert('✅ Lanche cadastrado!');
}

function carregarListaCadastrados(){
  const d=document.getElementById('listaLanchesCadastrados');
  d.innerHTML='';
  lanches.forEach((l,i)=>{
    d.innerHTML+=`<div class="item"><span>${l.nome} — R$ ${Number(l.preco).toFixed(2)}</span><button class="botao botaoVermelho" style="width:auto;padding:6px 10px;" onclick="excluirLanche(${i})">Excluir</button></div>`;
  });
}

function excluirLanche(i){lanches.splice(i,1);salvarLocal('lanches',lanches);carregarLanchesPedido();carregarListaCadastrados()}
</script>
</body>
</html>
