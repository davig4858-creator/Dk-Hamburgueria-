<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK HAMBURGUERIA — Painel</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,sans-serif;}
body {background:#080418;color:#fff;min-height:100vh;padding:12px;}
.topo {text-align:center;padding:22px;border-radius:16px;border:2px solid #D4AF37;background:linear-gradient(135deg,#250650,#5a109b);box-shadow:0 0 18px #7b2cbf;margin-bottom:16px;}
.topo h1 {color:#D4AF37;font-size:28px;text-shadow:0 0 6px #D4AF37;}
.abas {display:flex;gap:6px;margin-bottom:16px;}
.botaoAba {flex:1;padding:12px;border:none;border-radius:10px 10px 0 0;font-weight:bold;background:#220b44;color:#fff;cursor:pointer;transition:0.2s;}
.botaoAba.ativa {background:#D4AF37;color:#000;box-shadow:0 0 10px #D4AF37;}
.conteudoAba {display:none;background:#14072b;border:1px solid #7b2cbf;border-radius:0 14px 14px 14px;padding:16px;box-shadow:0 0 14px #3c1270;}
.conteudoAba.visivel {display:block;}
h2 {color:#D4AF37;margin-bottom:12px;}
h3 {margin:14px 0 6px;}
input {width:100%;padding:11px;border-radius:8px;border:1px solid #7b2cbf;background:#0b041b;color:#fff;margin:6px 0;}
.botao {width:100%;padding:12px;border:none;border-radius:9px;font-weight:bold;margin:7px 0;cursor:pointer;font-size:15px;}
.botaoDourado {background:#D4AF37;color:#000;box-shadow:0 0 8px #D4AF37;}
.botaoVerde {background:#2cc95b;color:#000;}
.botaoVermelho {background:#e63946;color:#fff;}
.botaoMais {background:#2cc95b;color:#000;font-weight:bold;width:40px;height:40px;border-radius:50%;border:none;font-size:20px;cursor:pointer;}
.botaoMenos {background:#e63946;color:#fff;font-weight:bold;width:40px;height:40px;border-radius:50%;border:none;font-size:20px;cursor:pointer;}
.item {background:#200d3f;border:1px solid #D4AF37;border-radius:10px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.quantidadeItem {background:#110622;border:1px solid #D4AF37;padding:6px 10px;border-radius:6px;font-weight:bold;min-width:30px;text-align:center;}
.totalDia {background:#1f0b3b;border:2px solid #D4AF37;border-radius:10px;padding:14px;margin:12px 0;text-align:center;font-size:20px;font-weight:bold;color:#D4AF37;}
.historicoPedido {background:#0f0520;border:1px solid #D4AF37;border-radius:10px;padding:12px;margin:10px 0;}
.botoesQuantidade {display:flex;align-items:center;gap:6px;}
.aviso {background:#2a1055;border:1px solid #7b2cbf;border-radius:8px;padding:10px;margin:10px 0;font-size:14px;color:#e0c9ff;}
</style>
</head>
<body>
<div class="topo"><h1>DK HAMBURGUERIA</h1></div>

<div class="abas">
<button class="botaoAba ativa" onclick="mudarAba(0)">📋 Lançar Pedidos</button>
<button class="botaoAba" onclick="mudarAba(1)">🍔 Cadastrar Lanches</button>
</div>

<div class="conteudoAba visivel" id="aba0">
<h2>Novo Pedido</h2>
<input type="text" id="nomeCliente" placeholder="Nome do cliente">
<input type="text" id="enderecoCliente" placeholder="Endereço">
<input type="number" id="taxaEntrega" step="0.01" placeholder="Taxa de Entrega R$">

<div class="aviso">🎁 Combo — digite nome e valor:</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
<input type="text" id="nomeCombo" placeholder="Nome do Combo" style="flex:1;min-width:150px;margin:0;">
<input type="number" id="valorCombo" step="0.01" placeholder="R$" style="width:100px;margin:0;">
</div>
<button class="botao botaoVerde" style="margin-top:8px;" onclick="adicionarComboAoPedido()">➕ Adicionar Combo</button>

<h3>🍔 Lanches disponíveis:</h3>
<div id="listaLanchesPedido"></div>

<h3>📝 Itens do pedido:</h3>
<div id="itensDoPedido"></div>

<div class="totalDia">💰 Total vendido no dia: R$ <span id="somaDia">0.00</span></div>

<div style="display:flex;gap:8px;flex-wrap:wrap;">
<button class="botao botaoVerde" style="flex:1;min-width:140px;" onclick="finalizarPedido()">✅ Finalizar Pedido</button>
<button class="botao botaoDourado" style="flex:1;min-width:140px;" onclick="imprimirPedido()">🖨️ Imprimir</button>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
<button class="botao botaoDourado" style="flex:1;min-width:140px;" onclick="salvarEDownloadDia()">💾 Salvar/Vendas</button>
<button class="botao botaoVermelho" style="flex:1;min-width:140px;" onclick="limparHistoricoDia()">🗑️ Limpar Dia</button>
</div>

<h3>📜 Histórico de pedidos do dia:</h3>
<div id="historicoPedidos"></div>
</div>

<div class="conteudoAba" id="aba1">
<h2>Cadastrar Lanches</h2>
<input type="text" id="nomeLancheNovo" placeholder="Nome do lanche">
<input type="number" id="precoLancheNovo" step="0.01" placeholder="Preço R$">
<button class="botao botaoDourado" onclick="cadastrarLanche()">➕ Cadastrar Lanche</button>

<h3>📋 Lanches cadastrados:</h3>
<div id="listaLanchesCadastrados"></div>
</div>

<script>
let abaAtual=0;
let lanches=[];
let itensPedidoAtual=[];
let historicoPedidos=[];

function salvarLocal(chave,valor){
  try{
    localStorage.setItem(chave,JSON.stringify(valor));
    return true;
  }catch(e){
    console.error('Erro ao salvar:',e);
    return false;
  }
}

function carregarLocal(chave){
  try{
    const dados=localStorage.getItem(chave);
    return dados ? JSON.parse(dados) : [];
  }catch(e){
    console.error('Erro ao carregar:',e);
    return [];
  }
}

function baixarArquivoTexto(nome,texto){
  const blob=new Blob([texto],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=nome;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.addEventListener('DOMContentLoaded',function(){
  lanches=carregarLocal('lanches');
  historicoPedidos=carregarLocal('historicoPedidos');
  console.log('Carregado:',historicoPedidos.length,'pedidos');
  mudarAba(0);
});

function mudarAba(n){
  abaAtual=n;
  document.querySelectorAll('.conteudoAba').forEach((el,i)=>el.classList.toggle('visivel',i===n));
  document.querySelectorAll('.botaoAba').forEach((el,i)=>el.classList.toggle('ativa',i===n));
  carregarLanchesPedido();
  carregarListaCadastrados();
  carregarHistorico();
  calcularTotalDoDia();
}

function adicionarComboAoPedido(){
  const nome=document.getElementById('nomeCombo').value.trim();
  const valor=Number(document.getElementById('valorCombo').value);
  if(!nome||!valor||valor<=0){
    alert('⚠️ Digite nome e valor do combo!');
    return;
  }
  itensPedidoAtual.push({nome:'COMBO: '+nome,preco:valor});
  document.getElementById('nomeCombo').value='';
  document.getElementById('valorCombo').value='';
  atualizarItensPedido();
  alert('✅ Combo adicionado!');
}

function carregarLanchesPedido(){
  const div=document.getElementById('listaLanchesPedido');
  div.innerHTML='';
  lanches.forEach(l=>{
    const qtd=contarItemPedido(l.nome);
    div.innerHTML+=`
      <div class="item">
        <span>${l.nome} — R$ ${Number(l.preco).toFixed(2)}</span>
        <div class="botoesQuantidade">
          <button class="botaoMenos" onclick="removerUmDoPedido('${l.nome}')">−</button>
          <span class="quantidadeItem">${qtd}</span>
          <button class="botaoMais" onclick="adicionarAoPedido('${l.nome}',${l.preco})">+</button>
        </div>
      </div>
    `;
  });
}

function contarItemPedido(nome){
  return itensPedidoAtual.filter(i=>i.nome===nome).length;
}

function adicionarAoPedido(nome,preco){
  itensPedidoAtual.push({nome:nome,preco:preco});
  atualizarItensPedido();
  carregarLanchesPedido();
}

function removerUmDoPedido(nome){
  const indice=itensPedidoAtual.findIndex(i=>i.nome===nome);
  if(indice!==-1){
    itensPedidoAtual.splice(indice,1);
    atualizarItensPedido();
    carregarLanchesPedido();
  }
}

function atualizarItensPedido(){
  const div=document.getElementById('itensDoPedido');
  div.innerHTML='';
  itensPedidoAtual.forEach((item,i)=>{
    div.innerHTML+=`
      <div class="item">
        <span>${item.nome} — R$ ${item.preco.toFixed(2)}</span>
        <button class="botao botaoVermelho" style="width:auto;padding:6px 10px;" onclick="removerItem(${i})">✕</button>
      </div>
    `;
  });
}

function removerItem(indice){
  itensPedidoAtual.splice(indice,1);
  atualizarItensPedido();
  carregarLanchesPedido();
}

function finalizarPedido(){
  const nomeCli=document.getElementById('nomeCliente').value.trim();
  const endCli=document.getElementById('enderecoCliente').value.trim();
  const taxa=Number(document.getElementById('taxaEntrega').value)||0;

  if(!nomeCli){
    alert('⚠️ Digite o nome do cliente!');
    return;
  }
  if(itensPedidoAtual.length===0){
    alert('⚠️ Adicione pelo menos um item!');
    return;
  }

  let totalItens=0;
  itensPedidoAtual.forEach(i=>totalItens+=i.preco);
  const totalFinal=totalItens+taxa;

  const pedido={
    id:Date.now(),
    dataHora:new Date().toLocaleString('pt-BR'),
    nomeCliente:nomeCli,
    endereco:endCli,
    taxaEntrega:taxa,
    itens:[...itensPedidoAtual],
    total:totalFinal
  };

  historicoPedidos.push(pedido);
  salvarLocal('historicoPedidos',historicoPedidos);
  
  console.log('Pedido salvo! Total:',historicoPedidos.length);
  
  carregarHistorico();
  calcularTotalDoDia();

  itensPedidoAtual=[];
  document.getElementById('nomeCliente').value='';
  document.getElementById('enderecoCliente').value='';
  document.getElementById('taxaEntrega').value='';
  atualizarItensPedido();
  carregarLanchesPedido();

  alert('✅ Pedido salvo! Total: R$ '+totalFinal.toFixed(2));
}

function calcularTotalDoDia(){
  let total=0;
  historicoPedidos.forEach(p=>total+=p.total);
  document.getElementById('somaDia').textContent=total.toFixed(2);
  salvarLocal('vendasDia',total);
}

function carregarHistorico(){
  const div=document.getElementById('historicoPedidos');
  div.innerHTML='';
  
  if(historicoPedidos.length===0){
    div.innerHTML='<p style="opacity:0.7;text-align:center;padding:20px;">Nenhum pedido salvo ainda.</p>';
    return;
  }
  
  historicoPedidos.forEach((pedido,indice)=>{
    let itensTexto='';
    pedido.itens.forEach(item=>{
      itensTexto+='• '+item.nome+' — R$ '+item.preco.toFixed(2)+'<br>';
    });
    div.innerHTML+=`
      <div class="historicoPedido">
        <strong>#${indice+1} — ${pedido.dataHora}</strong><br>
        <strong>Cliente:</strong> ${pedido.nomeCliente}<br>
        <strong>Endereço:</strong> ${pedido.endereco||'—'}<br>
        <strong>Itens:</strong><br>
        ${itensTexto}
        ${pedido.taxaEntrega>0 ? '<strong>Entrega:</strong> R$ '+pedido.taxaEntrega.toFixed(2)+'<br>':''}
        <strong style="color:#D4AF37;font-size:16px;">TOTAL: R$ ${pedido.total.toFixed(2)}</strong><br>
        <button class="botao botaoVermelho" style="margin-top:8px;padding:8px;" onclick="excluirPedido(${indice})">🗑️ Excluir este pedido</button>
      </div>
    `;
  });
}

function excluirPedido(indice){
  if(!confirm('Excluir este pedido?'))return;
  historicoPedidos.splice(indice,1);
  salvarLocal('historicoPedidos',historicoPedidos);
  carregarHistorico();
  calcularTotalDoDia();
}

function imprimirPedido(){
  const nomeCli=document.getElementById('nomeCliente').value||'Cliente';
  const endCli=document.getElementById('enderecoCliente').value||'';
  const taxa=Number(document.getElementById('taxaEntrega').value)||0;

  const agrupado={};
  itensPedidoAtual.forEach(i=>{
    if(!agrupado[i.nome])agrupado[i.nome]={qtd:0,preco:i.preco};
    agrupado[i.nome].qtd++;
  });

  let subtotal=0;
  let texto='';
  texto+='==========================\\n';
  texto+='    DK HAMBURGUERIA\\n';
  texto+='==========================\\n';
  texto+='DATA: '+new Date().toLocaleString('pt-BR')+'\\n';
  texto+='CLIENTE: '+nomeCli+'\\n';
  if(endCli)texto+='ENDEREÇO: '+endCli+'\\n';
  texto+='--------------------------\\n';
  texto+='ITENS:\\n';
  
  for(const nome in agrupado){
    const item=agrupado[nome];
    const valorItem=item.qtd*item.preco;
    subtotal+=valorItem;
    texto+=item.qtd+'x '+nome+'\\n';
    texto+='      R$ '+valorItem.toFixed(2)+'\\n';
  }
  
  texto+='--------------------------\\n';
  texto+='SUBTOTAL....: R$ '+subtotal.toFixed(2)+'\\n';
  if(taxa>0)texto+='ENTREGA.....: R$ '+taxa.toFixed(2)+'\\n';
  texto+='--------------------------\\n';
  texto+='TOTAL.......: R$ '+(subtotal+taxa).toFixed(2)+'\\n';
  texto+='==========================\\n';
  texto+='Obrigado! Volte sempre!\\n';
  texto+='\\n\\n\\n';

  console.log('Imprimindo...');
  window.location.href='rawbt://print?text='+encodeURIComponent(texto);
}

function salvarEDownloadDia(){
  if(historicoPedidos.length===0){
    alert('⚠️ Nenhum pedido salvo ainda!');
    return;
  }
  
  calcularTotalDoDia();
  const dataArquivo=new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
  let relatorio='';
  relatorio+='==============================\\n';
  relatorio+='   DK HAMBURGUERIA\\n';
  relatorio+='RELATÓRIO DE VENDAS — '+new Date().toLocaleDateString('pt-BR')+'\\n';
  relatorio+='==============================\\n\\n';
  
  let totalGeral=0;
  historicoPedidos.forEach((pedido,indice)=>{
    totalGeral+=pedido.total;
    relatorio+='PEDIDO '+(indice+1)+' — '+pedido.dataHora+'\\n';
    relatorio+='Cliente: '+pedido.nomeCliente+'\\n';
    if(pedido.endereco)relatorio+='Endereço: '+pedido.endereco+'\\n';
    relatorio+='Itens:\\n';
    pedido.itens.forEach(item=>{
      relatorio+='  - '+item.nome+'  R$ '+item.preco.toFixed(2)+'\\n';
    });
    if(pedido.taxaEntrega>0)relatorio+='  Entrega: R$ '+pedido.taxaEntrega.toFixed(2)+'\\n';
    relatorio+='TOTAL: R$ '+pedido.total.toFixed(2)+'\\n';
    relatorio+='------------------------------\\n\\n';
  });
  
  relatorio+='\\n==============================\\n';
  relatorio+='TOTAL GERAL DO DIA: R$ '+totalGeral.toFixed(2)+'\\n';
  relatorio+='Quantidade de pedidos: '+historicoPedidos.length+'\\n';
  relatorio+='==============================\\n';
  
  baixarArquivoTexto('vendas_'+dataArquivo+'.txt',relatorio);
  alert('💾 Relatório baixado com sucesso!');
}

function limparHistoricoDia(){
  if(historicoPedidos.length===0){
    alert('Já está vazio!');
    return;
  }
  if(!confirm('⚠️ Primeiro faça o download do relatório!\\nTem certeza que deseja apagar TODOS os pedidos?'))return;
  historicoPedidos=[];
  salvarLocal('historicoPedidos',historicoPedidos);
  carregarHistorico();
  calcularTotalDoDia();
  alert('🗑️ Histórico limpo! Pronto para o próximo dia!');
}

function cadastrarLanche(){
  const nome=document.getElementById('nomeLancheNovo').value.trim();
  const preco=Number(document.getElementById('precoLancheNovo').value);
  if(!nome||!preco||preco<=0){
    alert('⚠️ Digite nome e preço válido!');
    return;
  }
  lanches.push({nome:nome,preco:preco});
  salvarLocal('lanches',lanches
